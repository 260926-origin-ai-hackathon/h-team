appId: dev.farmercards.app
---
- stopApp
- openLink: "farmercards://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "生産者として使う"
    timeout: 90000
- tapOn: "生産者として使う"
- extendedWaitUntil:
    visible: ".*未対応リクエスト.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: shots/f01-home

# PR トグル
- tapOn: "優先表示（PR）"
- assertVisible: ".*優先表示をオンにしました.*"
- takeScreenshot: shots/f02-pr-on

# 予約リクエストを確定
- tapOn: "予約"
- extendedWaitUntil:
    visible: ".*予約管理.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: shots/f03-reservations
- tapOn:
    text: "予約 佐々木 健 リクエスト中"
    index: 0
- extendedWaitUntil:
    visible: ".*予約を確定する.*"
    timeout: 10000
- takeScreenshot: shots/f04-request-detail
- tapOn: ".*予約を確定する.*"
- extendedWaitUntil:
    visible: ".*受け渡し完了にする.*"
    timeout: 10000
- takeScreenshot: shots/f05-confirmed
- tapOn: ".*受け渡し完了にする.*"
- extendedWaitUntil:
    visible: ".*お客さまを評価する.*"
    timeout: 10000
- tapOn: "5つ星"
- tapOn: ".*評価を送る.*"
- extendedWaitUntil:
    visible: ".*お客さまを評価済み.*"
    timeout: 10000
- takeScreenshot: shots/f06-completed-rated

# 商品追加
- tapOn: "戻る"
- tapOn: "商品"
- extendedWaitUntil:
    visible: ".*商品を追加.*"
    timeout: 10000
- takeScreenshot: shots/f07-products
- tapOn: ".*商品を追加.*"
- extendedWaitUntil:
    visible: "商品名"
    timeout: 10000
- tapOn:
    id: "field-商品名"
- inputText: "Wakagobo Furikake"
- tapOn:
    id: "field-価格（円・税込）"
- inputText: "600"
- tapOn:
    id: "field-単位"
- inputText: "50g"
- pressKey: Enter
- scrollUntilVisible:
    element: "発送代行に対応"
    direction: DOWN
- tapOn: "発送代行に対応"
- takeScreenshot: shots/f08-product-form
- scrollUntilVisible:
    element: "この内容で追加"
    direction: DOWN
- tapOn: "この内容で追加"
- extendedWaitUntil:
    visible: ".*Wakagobo Furikake.*"
    timeout: 10000
- takeScreenshot: shots/f09-products-added

# レビュー / プロフィール
- tapOn: "レビュー"
- extendedWaitUntil:
    visible: ".*件.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: shots/f10-reviews
- tapOn: "プロフィール"
- extendedWaitUntil:
    visible: ".*01 · 人.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: shots/f11-profile
